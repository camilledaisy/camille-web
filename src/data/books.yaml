# ─────────────────────────────────────────────────────────────
#  THE BOOKSHELF
#
#  Every book is one entry. The only rules:
#    - `id` must be unique (any short slug works)
#    - `shelf` is one of:
#        reading   → currently reading
#        finished  → recently finished (put the newest at the top)
#        read      → read a while ago (use with favorite: true)
#        want      → the to-read pile
#
#  Optional things:
#    favorite: true      → also shows up on the Favorites shelf
#    progress: 0–100     → for books you're currently reading
#    finished: 2026-08-14   → if every recent book has one, they're sorted by it
#    rating: 1–5
#    note: "a sentence or two"
#    color: "#b8452c"    → cover/spine color (leave out and one is picked)
#    thoughts: /writing/some-post   → link to your writing about it
# ─────────────────────────────────────────────────────────────

