# ─────────────────────────────────────────────────────────────
#  THE SCRAPBOOK  (the collage at the bottom of the homepage)
#
#  kinds:
#    image   → src (+ caption)           a taped-in photo
#    quote   → text (+ caption = who)    a torn-out quote
#    link    → text + href (+ caption)   a link you love
#    note    → text                      a sticky note
#    swatch  → color + text              a paint chip
#    ticket  → text (+ caption)          a ticket stub
#
#  Order matters: things are placed in the order they appear here.
#  Images go in /public/img/ and are referenced like /img/my-photo.jpg
# ─────────────────────────────────────────────────────────────

- id: window-light
  kind: image
  src: /img/print-window.svg
  caption: 4pm window light, sept

- id: quote-siken
  kind: quote
  text: I sleep. I dream. I make up things that I would never say. I say them very quietly.
  caption: Richard Siken

- id: link-poolsuite
  kind: link
  text: a website that is just a very nice radio
  href: https://www.radio.garden/
  caption: radio.garden

- id: sticky-1
  kind: note
  text: start using my film camera again

- id: swatch-sept
  kind: swatch
  color: "#8fae5a"
  text: color of the month — matcha, whisked too long

- id: ticket-cinema
  kind: ticket
  text: "ADMIT ONE · Blue Heron (2025)"

- id: flowers
  kind: image
  src: /img/print-flowers.svg
  caption: market flowers, $6

- id: quote-oliver
  kind: quote
  text: Instructions for living a life. Pay attention. Be astonished. Tell about it.
  caption: Mary Oliver

- id: link-2001
  kind: link
  text: "every single frame of 2001: A Space Odyssey"
  href: https://www.everysingleframe.com/2001aspaceodyssey
  caption: everysingleframe.com
